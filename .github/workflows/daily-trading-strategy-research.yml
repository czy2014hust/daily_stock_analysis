name: 每日交易策略研究 (Cursor Skill)

on:
  # 每天北京时间 09:00（UTC 01:00）
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      feishu_test_only:
        description: '仅测试飞书连通性（不调用 Cursor API）'
        required: false
        default: false
        type: boolean
      skip_feishu:
        description: '跳过飞书推送（仅触发 Cursor Agent）'
        required: false
        default: false
        type: boolean
      extra_prompt:
        description: '追加给 Cursor Agent 的研究焦点（可选）'
        required: false
        default: ''
        type: string

concurrency:
  group: trading-strategy-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.TRADING_STRATEGY_RESEARCH_TIMEOUT_MINUTES || '90') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install python-dotenv requests lark-oapi

      - name: Require CURSOR_API_KEY
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.feishu_test_only != 'true' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Missing repository secret CURSOR_API_KEY (Cursor Dashboard → API Keys)"
            exit 1
          fi

      - name: Trigger trading-strategy-research via Cursor API
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_API_BASE_URL: ${{ vars.CURSOR_API_BASE_URL || secrets.CURSOR_API_BASE_URL || 'https://api.cursor.com' }}
          CURSOR_AGENT_REPO_URL: ${{ vars.CURSOR_AGENT_REPO_URL || format('https://github.com/{0}', github.repository) }}
          CURSOR_AGENT_STARTING_REF: ${{ vars.CURSOR_AGENT_STARTING_REF || 'main' }}
          CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL || secrets.CURSOR_AGENT_MODEL }}
          CURSOR_AGENT_NAME: ${{ vars.CURSOR_AGENT_NAME || 'Daily Trading Strategy Research' }}
          CURSOR_AGENT_POLL_SECONDS: ${{ vars.CURSOR_AGENT_POLL_SECONDS || '20' }}
          CURSOR_AGENT_TIMEOUT_SECONDS: ${{ vars.CURSOR_AGENT_TIMEOUT_SECONDS || '3300' }}
          TRADING_STRATEGY_RESEARCH_PROMPT_EXTRA: ${{ github.event.inputs.extra_prompt || vars.TRADING_STRATEGY_RESEARCH_PROMPT_EXTRA || '' }}
          SKIP_FEISHU: ${{ github.event.inputs.skip_feishu == 'true' && 'true' || 'false' }}
          FEISHU_TEST_ONLY: ${{ github.event.inputs.feishu_test_only == 'true' && 'true' || 'false' }}
          # Reuse the same Feishu secrets as 每日股票分析
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID || vars.FEISHU_CHAT_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ vars.FEISHU_RECEIVE_ID_TYPE || secrets.FEISHU_RECEIVE_ID_TYPE || 'chat_id' }}
          FEISHU_DOMAIN: ${{ vars.FEISHU_DOMAIN || secrets.FEISHU_DOMAIN || 'feishu' }}
          FEISHU_MAX_BYTES: ${{ vars.FEISHU_MAX_BYTES || secrets.FEISHU_MAX_BYTES }}
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          echo "Repo: $CURSOR_AGENT_REPO_URL @ $CURSOR_AGENT_STARTING_REF"
          echo "Feishu test only: ${FEISHU_TEST_ONLY:-false}"
          echo "Feishu webhook: $([ -n "${FEISHU_WEBHOOK_URL:-}" ] && echo configured || echo missing)"
          echo "Feishu app bot: $([ -n "${FEISHU_APP_ID:-}" ] && [ -n "${FEISHU_APP_SECRET:-}" ] && [ -n "${FEISHU_CHAT_ID:-}" ] && echo configured || echo missing)"
          if [ "${FEISHU_TEST_ONLY:-false}" = "true" ]; then
            python scripts/trigger_trading_strategy_research.py --feishu-test
          else
            python scripts/trigger_trading_strategy_research.py
          fi

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trading-strategy-research-${{ github.run_number }}
          path: reports/trading_strategy_research_*.md
          if-no-files-found: ignore
          retention-days: 30
